apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo-deployment
  labels:
    app: cicd-demo
spec:
  # duy trì hai bản sao để đảm bảo tính sẵn sàng cao
  replicas: 2

  # cập nhật từng phần để dịch vụ không bị gián đoạn
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: cicd-demo

  template:
    metadata:
      labels:
        app: cicd-demo
    spec:
      containers:
        - name: cicd-demo
          # sử dụng tag phiên bản cố định, không dùng latest
          image: cicd-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000

          # kiểm tra ứng dụng sẵn sàng nhận khách chưa để hỗ trợ tự động rollback
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          # kiểm tra ứng dụng còn sống không, tự khởi động lại nếu bị sập
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
